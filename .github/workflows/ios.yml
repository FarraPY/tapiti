name: Compilar IPA

# Se dispara a mano desde la pestaña Actions, o en cada push a main.
on:
  workflow_dispatch:
  push:
    branches: [main, prueba-sin-nativo]

jobs:
  build:
    # macOS es obligatorio: el proyecto iOS no se puede generar ni compilar en otro lado.
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar antes de compilar
        run: |
          npx tsc --noEmit
          node --experimental-strip-types --no-warnings scripts/check-blocking.ts

      # El proyecto nativo no se versiona: se genera acá en cada compilación, así
      # nunca queda desfasado de app.json ni de los módulos.
      - name: Generar proyecto iOS
        run: npx expo prebuild --platform ios --no-install

      - name: Instalar pods
        working-directory: ios
        run: pod install --repo-update

      - name: Leer nombre del esquema
        id: scheme
        run: echo "name=$(node -p "require('./app.json').expo.name")" >> "$GITHUB_OUTPUT"

      # Sin firma: el IPA sale "crudo" y se firma después en el teléfono con Feather.
      # Así el certificado nunca sale de tu máquina ni pasa por GitHub.
      - name: Compilar sin firmar
        # FORCE_BUNDLING obliga a empaquetar el JavaScript dentro de la app. En
        # Release deberia pasar solo, pero si no pasa la app se cierra al abrir sin
        # ningun mensaje, que es el sintoma mas dificil de diagnosticar de todos.
        env:
          FORCE_BUNDLING: '1'
        run: |
          xcodebuild \
            -workspace "ios/${{ steps.scheme.outputs.name }}.xcworkspace" \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            | xcpretty || exit 1

      # Una app a la que le falta el paquete de JavaScript, o cuyo identificador no
      # coincide con el del certificado, se cierra al instante y sin mostrar nada.
      # Los dos casos se ven acá y no en el teléfono.
      - name: Revisar el paquete
        run: |
          APP="build/Build/Products/Release-iphoneos/${{ steps.scheme.outputs.name }}.app"
          test -d "$APP" || { echo "::error::No se generó $APP"; exit 1; }

          echo "=== identificador y versión ==="
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"

          echo "=== ejecutable ==="
          BIN="$APP/${{ steps.scheme.outputs.name }}"
          test -f "$BIN" || { echo "::error::Falta el ejecutable"; exit 1; }
          file "$BIN"
          lipo -archs "$BIN" || true

          echo "=== paquete de JavaScript ==="
          if [ -f "$APP/main.jsbundle" ]; then
            ls -lh "$APP/main.jsbundle"
          else
            echo "::error::Falta main.jsbundle: la app se cerraría apenas la abrís."
            echo "Contenido del .app:"
            ls -la "$APP"
            exit 1
          fi

          echo "=== recursos ==="
          ls "$APP" | head -25

      - name: Empaquetar IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/${{ steps.scheme.outputs.name }}.app"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "${{ steps.scheme.outputs.name }}.ipa" Payload
          ls -lh "${{ steps.scheme.outputs.name }}.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: '*.ipa'
          retention-days: 30
